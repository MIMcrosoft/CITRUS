<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erreur serveur — Ligue des Pamplemousses</title>
<style>
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    background: #15181C;
    color: #F4F2ED;
    font-family: "Maven Pro", "Segoe UI", Arial, sans-serif;
    text-align: center;
  }
  .carte {
    max-width: 32rem;
    padding: 2rem 1.25rem;
    background: #1E2227;
    border-top: 0.5rem solid #FFC94A;
    border-radius: 0.85rem;
    box-shadow: 0.25rem 0.25rem 0 rgb(0 0 0 / 35%);
  }
  .code { margin: 0; font-size: 4.5rem; font-weight: 900; line-height: 1; color: #FFC94A; }
  h1 { margin: 0.75rem 0; }
  p { color: #9AA1AA; margin: 0 0 2rem; }
  a {
    display: inline-block;
    padding: 0.5rem 2rem;
    border-radius: 999px;
    background: linear-gradient(135deg, #F05D5F 0%, #F48E42 55%, #F7B12F 100%);
    color: #15181C;
    font-weight: 700;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="carte">
    <p class="code">500</p>
    <h1>{{ titre }}</h1>
    <p>{{ message }}</p>
    <a href="/">Retour à l'accueil</a>
  </div>
</body>
</html>
