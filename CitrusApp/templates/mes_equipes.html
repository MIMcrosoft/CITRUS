{% extends 'base.html' %}
{% block content %}

    <h1>Mes Équipes</h1>
    <table>
        <tr class="tableHeaderRow">
            <th>Équipe</th>
            <th>Division</th>
            <th>Saison</th>
            <th></th>

        </tr>
        {% for alignement in alignements %}
            <tr>
                <td>{{ alignement.equipe.nom_equipe }}</td>
                <td>{{ alignement.division|default:alignement.equipe.division }}</td>
                <td>{{ alignement.saison.nom_saison }}</td>
                <td>
                    <div style="display: flex; flex-direction: row">
                        <button id="modalBtn" onclick="navTo(this, '/Citrus/Equipe{{ alignement.equipe.id_equipe }}-{{ alignement.saison.saison_id   }}', false)">Afficher</button>
                        <button id="modalBtn" onclick="navTo(this, '/Citrus/EquipeIPP{{ alignement.equipe.id_equipe }}-{{ alignement.saison.saison_id   }}', false)">Voir l'IPP</button>
                    </div></td>



            </tr>
        {% endfor %}
    </table>
    <style>
        button{
            margin: 0.5rem 0 0.5rem 0;
        }
    </style>
{% endblock %}
